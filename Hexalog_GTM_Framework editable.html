--te-f:#085041;--te-s:#5DCAA5;--te-t:#E1F5EE;--te-u:#9FE1CB;--am-f:#633806;--am-s:#EF9F27;--am-t:#FAEEDA;--am-u:#FAC775;

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:32px 16px 80px}
h1{font-size:28px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600;margin:0 0 4px}
h3{font-size:16px;font-weight:600}
.dek{color:var(--text-secondary);margin:0 0 14px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
nav a{font-size:13px;color:var(--text-accent);text-decoration:none;border:0.5px solid var(--border-strong);border-radius:99px;padding:4px 12px}
section{margin-top:44px}
.sub{color:var(--text-secondary);font-size:14px;margin:0 0 12px}
svg{display:block;width:100%;height:auto}
.th{font-size:14px;font-weight:500;fill:var(--text-primary)}.ts{font-size:12px;fill:var(--text-secondary)}
.c-purple>rect,.c-purple>circle,circle.c-purple,rect.c-purple{fill:var(--pu-f);stroke:var(--pu-s)}.c-purple>.th{fill:var(--pu-t)}.c-purple>.ts{fill:var(--pu-u)}
.c-gray>rect,.c-gray>circle,circle.c-gray,rect.c-gray{fill:var(--gr-f);stroke:var(--gr-s)}.c-gray>.th{fill:var(--gr-t)}.c-gray>.ts{fill:var(--gr-u)}
.c-teal>rect,.c-teal>circle,circle.c-teal,rect.c-teal{fill:var(--te-f);stroke:var(--te-s)}.c-teal>.th{fill:var(--te-t)}.c-teal>.ts{fill:var(--te-u)}
.c-amber>rect,.c-amber>circle{fill:var(--am-f);stroke:var(--am-s)}.c-amber>.th{fill:var(--am-t)}.c-amber>.ts{fill:var(--am-u)}
.c-coral>rect,.c-coral>circle{fill:var(--co-f);stroke:var(--co-s)}.c-coral>.th{fill:var(--co-t)}.c-coral>.ts{fill:var(--co-u)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 8px}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--text-secondary)}.lg span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.tg{display:flex;flex-wrap:wrap}
.tg button{font:inherit;font-size:13px;padding:5px 11px;border:0.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-secondary);cursor:pointer;margin-left:-1px}
.tg button:first-child{border-radius:var(--radius) 0 0 var(--radius);margin-left:0}.tg button:last-child{border-radius:0 var(--radius) var(--radius) 0}
.tg button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.card{border:0.5px solid var(--border);border-radius:12px;padding:16px 18px;background:var(--surface-1);margin-top:10px;font-size:14px;line-height:1.55}
.card h3{margin:0 0 4px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.flow>div{border:0.5px solid var(--border);border-radius:var(--radius);padding:10px;background:var(--surface-2)}
.lbl{font-size:12px;color:var(--text-muted);margin:12px 0 4px}.flow .lbl{margin-top:0}
.oc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:6px 0}.oc div{border-radius:var(--radius);padding:8px 10px;font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px;padding:7px 0;border-top:0.5px solid var(--border)}
.dp{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:5px 0;border-top:0.5px solid var(--border)}
.ed{display:flex;flex-wrap:wrap;gap:14px}.ed label{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
input[type=number],input[type=text],select{font:inherit;font-size:13px;padding:4px 6px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary)}
input[type=number]{width:64px}
ul.l{margin:0;padding-left:18px}ul.l li{margin:2px 0}
.pz g{cursor:pointer}.pz g:hover rect{opacity:.85}.pz g.sel rect{stroke-width:2.5}
.rt button{font:inherit;font-size:12px;padding:4px 10px;border:0.5px solid var(--border-strong);border-radius:99px;background:var(--surface-2);color:var(--text-secondary);cursor:pointer;margin:0 6px 6px 0}
.rt button.on{background:var(--bg-success);color:var(--text-success);border-color:var(--border-success)}
.nd{cursor:pointer}.nd.sel rect{stroke-width:2.5}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;min-width:560px}
td,th{padding:5px 6px;border-bottom:0.5px solid var(--border);text-align:left}th{font-weight:400;color:var(--text-muted);font-size:12px}
tr.sel td{background:var(--bg-accent)}
.btn{font:inherit;font-size:13px;padding:5px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);cursor:pointer}
.add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.err{font-size:13px;color:var(--text-danger)}
textarea{width:100%;height:100px;font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:8px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary)}
.og{display:grid;grid-template-columns:150px repeat(7,minmax(44px,1fr));font-size:13px;min-width:560px}
.og>div{padding:8px 4px;border-bottom:0.5px solid var(--border);text-align:center;display:flex;align-items:center;justify-content:center}
.og .h{color:var(--text-muted);font-size:12px}.og .nm{justify-content:flex-start;text-align:left;cursor:pointer}
.og .nm:hover{color:var(--text-accent)}.og .sel{background:var(--bg-accent)}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}.dot.L{background:#534AB7}.dot.H{border:1.5px solid #7F77DD}
@media (max-width:560px){.row{grid-template-columns:1fr}.dp{grid-template-columns:1fr}}

.edbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin:0 0 20px;background:var(--surface-1);border:0.5px solid var(--border-strong);border-radius:12px;font-size:13px}
.edst{font-weight:600;margin-right:4px}
.edmsg{color:var(--text-secondary);font-size:12.5px}
.btn.pri{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{font-size:12px;padding:4px 10px;margin-top:6px}
.btn.x{padding:4px 8px;line-height:1}
.restore{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin:0 0 16px;border-radius:12px;background:var(--bg-warning);color:var(--text-warning);font-size:13px}
body.editing [data-t]{outline:1px dashed var(--border-accent);outline-offset:3px;border-radius:4px;cursor:text}
body.editing #pzPanel{border-color:var(--border-accent)}
.ef{display:flex;flex-direction:column;gap:4px;margin:10px 0;font-size:12px;color:var(--text-muted)}
.ef input[type=text],.ef textarea,.erow textarea,.ew textarea{width:100%;font-family:inherit;font-size:13.5px;line-height:1.45;height:auto;min-height:34px;margin:0;padding:6px 8px;resize:vertical;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary)}
.ef textarea{min-height:58px}
.eg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.el{margin:14px 0}
.erh,.erow{display:grid;grid-template-columns:96px repeat(var(--n),minmax(0,1fr)) 34px;gap:6px;align-items:start}
.erh{font-size:11.5px;color:var(--text-muted);margin-bottom:4px}
.erow{margin:4px 0}
.ew{display:grid;grid-template-columns:130px 92px minmax(0,1fr) 34px;gap:6px;align-items:start;margin:4px 0;font-size:13px}
#ogPanel .ew{grid-template-columns:110px 120px minmax(0,1fr)}
.ck{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.hint{font-size:12px;color:var(--text-muted);margin-top:12px}
@media (max-width:560px){.erh{display:none}.erow,.ew,#ogPanel .ew{grid-template-columns:1fr}}

.mcard{border:0.5px solid var(--border);border-radius:12px;background:var(--surface-2);padding:12px 14px;margin:0 0 14px;font-size:13px;color:var(--text-secondary)}
.mcard p{margin:0;white-space:pre-line}
.mcard .mnow{margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border);color:var(--text-primary);font-size:13.5px}
.sw.dt{border-radius:50%}
.ns{border:0.5px solid var(--border-accent);border-radius:10px;background:var(--surface-2);padding:12px 14px;margin:8px 0 6px}
.nsh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.nst{font-size:12px;font-weight:600;color:var(--text-accent);text-transform:uppercase;letter-spacing:.06em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--c);color:var(--text-primary)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.nsn{font-size:13.5px;line-height:1.55}
.nsg{font-size:13px;margin-top:8px;color:var(--text-secondary)}
.nss{font-size:12px;margin-top:8px;color:var(--text-muted)}
.nsedit{border:0.5px dashed var(--border-accent);border-radius:10px;padding:2px 12px;margin:8px 0}
.ef select{max-width:240px}

Kanishka Verma reviews, Dibyanshu signs"],"SAL":["H","Reality check on the route"],"SUP":["H","Route cost: rates and capacity"],"OPS":["H","Can we serve this ICD or port? What to build?"],"CUS":["H","Customs-first route, licence or port presence needed?"],"PAR":["H","Terms for an association-led route"]},"S4":{"SAL":["L","Tests the pitch"],"SUP":["L","Rate card on the top lane"],"CEO":["H","Puts the playbook together"],"GRO":["H","Collateral, case studies"],"OPS":["H","Ops ready at the ICD"],"CUS":["H","Customs offer, document pre-check"],"TEC":["H","Tracking demo, partner view of deals"],"CX":["H","Onboarding plan"]},"S5":{"SAL":["L","Closes pilot clients"],"OPS":["L","Runs pilot shipments"],"CUS":["L","Clears pilot shipments"],"CX":["L","First-shipment care, fixes within 24 hrs"],"SUP":["H","Space and capacity"],"TEC":["H","Visibility for pilot clients"],"CEO":["H","Tracks pilot vs target"]},"S6":{"GRO":["L","Referral engine, repeat campaigns"],"CX":["L","Feedback, repeat and referral asks"],"SAL":["H","Cross-sell, account growth"],"SUP":["H","Better rates as volume grows"],"OPS":["H","Service quality at scale"],"CUS":["H","Compliance updates as client hooks"],"TEC":["H","Client and partner portal"],"CEO":["H","Market P&L"]},"LN":{"CEO":["L","Updates thresholds and idea cards for the next market"]}},"S":{"ST":{"t":"Start · Pick market and direction","inp":[["b","Recce shortlist and priority"],["b","Where we already have sales people"],["b","Direction: export, import or both"]],"act":"Tag the direction, open a market row in the tracker, name the owner.","out":"Market card: ID, direction, owner, start date.","dec":"No gate. Goes straight to Stage 0.","r":[["b","Picking by gut","Market not on the shortlist","Pick from the Recce list only"],["b","Mixing directions in one list","Importers and exporters in the same sheet","Separate rows per direction"]],"m":"None yet.","xl":"Markets","ns":{"st":"Done","v":"","n":"• Market: Noida electronics component imports, the anchor EMS belt. Micro-market R2-09, Ring 2.\n• Direction: Import. Finished-goods export forwarding is a later cross-sell.\n• Owner: Vedant Sharma, CEO's office, reporting to Kanishka Verma (project lead). Sales Head: Abhishek Tikkha. Sign-off: Dibyanshu.\n• Week 1 (3–5 Sept): industry research done (OEM, ODM and EMS structures; import countries) and the GTM concept notes reviewed.\n• How our four-phase charter maps onto this board: Survey = Stages 0–2 · Meetings = Stage 2 · Product (build / partner / buy) = Stages 3–4 · GTM Plan = Gate 3 sign-off plus the Stage 4 playbook.","src":"Hexalog Micro-Market GTM concept notes; Phase 1 status log (29 Sept)"}},"S0":{"t":"Stage 0 · Market picture","inp":[["b","Trade data (Volza, Seair)"],["e","Shipping bills, last 12 months"],["i","Bills of entry, last 12 months"],["b","EPC and association member lists"],["b","Our lane rates (from Supply)"],["i","Duty, BIS, WPC rules on top HS codes"],["e","Export schemes and trade deals"]],"act":"Clean the list down to active traders, tag each trader by type (Incoterm plus buyer or supplier name), find top lanes and peak months, work out a rough money size.","out":"Active trader count, trader mix %, top 3 lanes, peak months, rough ₹ size, incumbent list.","dec":"Is the market big enough, and are the lanes ones we can win?","g":"At least {minT} active traders, and we can serve their top lane.","o":{"pass":"{minT} or more → Stage 1","hold":"{sat} to {minT} → run alongside a nearby market","pivot":"Top lane weak for us → Supply check or partner forwarder","park":"Under {sat} → park"},"r":[["b","List is stale or full of middlemen","Over 30% dead numbers or non-traders in the first 20 checks","Rebuild from ICD data and trade data"],["b","Big market, weak lanes","Top 3 lanes outside our rate strength","Supply check before calling; line up a partner forwarder"],["b","Wrong timing","Peak season over or under 6 weeks away","Plan the push before the next peak"],["i","Rules change on key HS codes","New BIS or anti-dumping notice","Customs team briefs us; use it as a reason to call"]],"m":"Rough size = active traders × shipments a year × revenue per shipment. Realistic year-1 share: 2 to 5%.","xl":"Stage0 Picture, Accounts, Money","ps":["minT","sat"],"ns":{"st":"Done","v":"hold","n":"• Universe: 168 raw company names (Noida electronics company list, compiled 1 Sept 2026). About 80 sorted for calling against our target profile.\n• Trader mix: 140 of the 168 carry only a generic 'Electronics Manufacturing' tag; 28 are PCB/SMT job-work shops. Product type is not yet known for most names.\n• Top lanes (research): China, plus Hong Kong, Vietnam, Korea and Taiwan → IGI air for high-value ICs and displays; JNPT/Mundra → rail to ICD Dadri and ICD Tughlakabad for bulk parts.\n• Peak months (research): June–October, and a pre-build before Chinese New Year (Jan–Feb).\n• Rough size: India's HS-85 imports were ₹7,50,324 cr in FY24-25 (ELCINA / DGCI&S, verified). Noida corridor about US$12–20 bn of trade a year and logistics SAM about US$0.6–1.2 bn a year — both derived estimates, low confidence.\n• Incumbents (research): global forwarders (DHL, Kuehne+Nagel, DB Schenker, Expeditors, DSV) on the OEM accounts; CONCOR on rail and ICD Dadri; local CHAs at IGI and the ICDs.\n• Gate check: about 80 sorted names is below the 150 bar, and 'active' (shipped in the last 12 months) has not been checked against bills-of-entry data. Supply has not yet checked our rates on the top lanes.\n• Verdict by this board's rule: Hold (the 60–150 band). Calling went ahead in parallel. Note: this is an anchor-led market, so a head count understates its value.","src":"Noida_Electronics_Companies_Enriched_v2.xlsx; Noida EMS research sheet (R2-09); concept notes"}},"S1":{"t":"Stage 1 · People map","inp":[["b","Active trader list from Stage 0"],["b","Contacts of our sales, ops, ICD and customs people"],["b","Existing clients in or near the cluster"],["b","Associations, CHAs, banks, CAs"],["e","Buying houses"],["i","Distributors, BIS consultants, origin agents"]],"act":"Draw the rings. Mark each person warm, lukewarm or cold. For each target account, pick the path: direct, via one door, or via two doors. Name a backup for each door.","out":"People register, ring picture, ways-in count by type, a path per target account.","dec":"Do we have enough ways in, and which path do we take for each account?","g":"At least {doors} ways in, of 2 or more types, each with a backup. A direct line to a decision maker counts as a way in.","o":{"pass":"{doors} or more → Stage 2","hold":"Fewer → map for one more week","pivot":"Only cold paths → direct calling with trigger events, flag it","park":"No way in after 3 weeks and a thin list → park"},"r":[["b","Everything hangs on one person","Most paths run through one contact","Backup for every door before Stage 2"],["b","The door is also a rival","A CHA or forwarder pushes his own service","Offer only what he does not do; terms in writing"],["b","Our own people do not give time","No intro in 2 weeks","Raise it in the weekly calling session"],["b","Association is slow","No reply in 3 weeks","Go through an office bearer or member trader"]],"m":"Cost of doors: membership fees, what partners will ask as commission.","xl":"People, Accounts","ps":["doors"],"ns":{"st":"In progress","v":"hold","n":"• Ways in found so far, by type:\n  – Direct: cold calling from the sorted list.\n  – Association: ELCINA (about 350 members; about 65% in the south; 70–80 in the north). Meeting held 28 Sept. Dibyanshu's decision: take the Directory now (₹5,000) and revisit membership later.\n  – Trade fair: SEMICON India 2026 (18 Sept, with ELCINA). 12 contacts logged, including logistics people at Hitachi, Tata Electronics, NM Tronics and CIR-Q-TECH. Follow-ups prepared.\n• Not yet mapped: Hexalog's own customs, ICD and ops staff as doors; existing clients near the cluster; banks, CAs, BIS consultants, distributors.\n• No backup is named for any door yet.\n• Verdict: Hold. Three ways in, of three types, but no backups, so the gate is not fully met.","src":"ELCINA MoM (28 Sept); Wonsorin's recommendation (29 Sept) and Dibyanshu's decision; SEMICON event contact list.xlsx"}},"S2":{"t":"Stage 2 · Listen","inp":[["b","Accounts and paths from Stage 1"],["b","Call and visit scorecard"],["b","Contacts from Apollo and the sales tool"]],"act":"Calls and visits along the chosen path. Learn, do not pitch. Fill the scorecard after every talk. Weekly group calling session.","out":"Real talks count, connect and meeting rate, confirmed trader mix, who controls freight, CHA dependence, top 3 pains, volumes, current rates.","dec":"What does this market need, and who decides? This feeds the route rules.","g":"At least {talks} real conversations, and we know who controls freight, CHA dependence and the top 3 pains.","o":{"pass":"{talks} or more → Stage 3","hold":"Half-way → one more week","pivot":"Pickup under {pick}% → change path: doors, WhatsApp, visits","park":"Nobody talks even through doors → park"},"r":[["b","Nobody picks up","Connect rate under {pick}% after 100 dials","Stop cold dialling; go through doors, WhatsApp first, then visit"],["b","Wrong person","Over half the talks are not the owner or head","Ask for the owner; visit"],["b","Rate requests too early","Quote asked before lane or volume shared","No quote until we know lane, volume and Incoterm"],["i","Importer will not share supplier terms","No Incoterm in 3 of 5 calls","Start with clearance pain; terms come later"],["b","Only friendly voices","All talks from one source","Mix sources"]],"m":"Current rates and shipments a month → revenue per account estimate.","xl":"Scorecard, Activity log","ps":["talks","pick"],"ns":{"st":"In progress","v":"pivot","n":"• Calls: 50 companies called, 10 conversations, 1 client meeting (Vedant's figures as of 29 Sept; the calling tracker file is not fully up to date).\n• Pickup is about 20%, under the 25% floor. By this board's rule that means change path: doors (ELCINA directory, SEMICON contacts), WhatsApp follow-ups, visits.\n• Meeting 1 · JSD Electronics (15 Sept): GPS device maker. Imports PCBs and modules from JLCPCB (Shenzhen, with Hong Kong operations). 3–4 shipments a month of 25–30 kg, about a week door to door. Incumbent: ShipGlobal. Buys FOB, so JSD picks the forwarder. DDU: pays duty itself on the government portal. Low volume.\n• Who controls freight: contract manufacturers usually don't. The brand that contracts them arranges freight and customs and delivers parts to them, and they won't share their client's contact. Several calls also answered 'not into EXIM' or 'customer-based forwarder'.\n• Decision after JSD: move up to mid-size companies (₹500 cr+ revenue, global presence) that own their import decision. A working direction, not yet a validated ICP.\n• Not yet known: CHA dependence and the top 3 pains.\n• Meetings shown as 'aligned' in the tracker (Neolync, Wisepower, ERD Technologies) have not happened yet.","src":"Phase 1 status log; JSD Electronics MoM; Calling tracker GTM NOIDA EMS.xlsx (outcome notes)"}},"S3":{"t":"Stage 3 · Route","inp":[["b","All nine inside pieces"],["b","Route rules"],["b","Cost per route: people, partner commission, memberships"],["b","Capability gaps"]],"act":"Run the rules, first match wins: anchor-led, buyer or supplier-side nomination, CHA-led, association-led, direct, platform or tech-led, two-way bundle, hybrid, park. Name a backup. For every gap, check build vs partner vs buy.","out":"Main route and backup route, money sheet (year-1 revenue, cost, payback), capex yes or no.","dec":"Which route, what do we need to build, and is it worth it?","g":"Signed off by Dibyanshu sir: route and backup, payback within {pay} months, capex only if the pilot cannot run without it.","o":{"pass":"Signed → Stage 4","hold":"Two routes tie → test both for 30 days","pivot":"Money does not work → cheaper route, partner instead of build","park":"No rule fires → re-check in 2 quarters"},"r":[["b","Gut decision","Route does not match the rules","Re-run the rules"],["b","Money does not work","Payback over {pay} months","Cheaper route or park"],["b","Building too early","Capex asked before a pilot","Partner or lease first; build after Gate 5"],["b","No plan B","Backup route not named","No sign-off until it is"]],"m":"Route P&L: year-1 revenue, cost (people, partners, memberships, pilot discount), payback, capex needed.","xl":"Route, Money","ps":["pay"],"ns":{"st":"Not started","v":"","n":"• Not started. Starting ideas from research, to test once Stage 2 is through:\n  – Entry target: mid-size EMS and Tier-1 importers, not the anchor OEMs that global forwarders hold.\n  – Candidate routes: direct to ₹500 cr+ importers; association-led through the ELCINA directory; anchor-led later.\n  – Entry offer idea: a 'JIT Component Import Desk' — fast IGI air clearance plus a MOOWR bonded warehouse near Noida, so duty is paid only when parts go to the line.\n  – Build / partner / buy idea: partner the IGI air desk and a MOOWR-licensed warehouse first; build the customs-compliance and visibility layer in-house; buy or lease space only once volume is proven.\n  – Commit trigger in the research map: 10 or more letters of intent and a confirmed Jewar cargo terminal timeline.","src":"Noida EMS research sheet, sections 5 and 7"}},"S4":{"t":"Stage 4 · Build","inp":[["b","Route decision"],["b","Pains log from Stage 2"],["b","Lane rates from Supply"],["b","Partner terms"],["b","Ops and customs readiness at the ICD or port"]],"act":"Write the pitch per trader type. Set the entry offer: freight first, customs first for nominated or CIF buyers. Rate card, partner agreement, onboarding plan. Test the pitch on {test} traders.","out":"Playbook: pitch, offer, rate card, partner terms, onboarding plan, pilot target.","dec":"Are we ready to ship?","g":"Pitch tested on {test} traders, rate card ready on the top lane, partner terms signed (if channel), ops and customs ready.","o":{"pass":"All ready → Stage 5","hold":"One item missing → 2 weeks to close","pivot":"Partner will not sign → next route","park":"Cannot price competitively → park"},"r":[["b","Partner not earning enough","Partner says he is working on it for 4+ weeks","Show him his earning per shipment; match market commission"],["b","Our rates lose","Lose 3 of 5 quotes on price","Supply review; focus on a lane where we win"],["b","Pitch does not land","Traders do not talk about their problem for 20+ seconds","Rewrite from the pains log"],["i","Compliance slip on the first import","Documents or BIS not checked","Customs team pre-checks pilot documents"]],"m":"Margin per shipment after partner commission and pilot discount.","xl":"Partners, Scorecard (pitch tested), Money","ps":["test"],"ns":{"st":"Not started","v":"","n":"• Not started. Pitch ideas to test once the pains are confirmed:\n  – Finance head: cash released by deferring duty (MOOWR), shown with a calculator on their own import numbers.\n  – Plant head: faster clearance on line-critical parts, so the line doesn't stop.\n• Rate card on the top lane, partner terms, and readiness at IGI and ICD Dadri: to confirm with Supply, Operations and Customs.","src":"Noida EMS research sheet; concept notes (Pilot 1 hypothesis)"}},"S5":{"t":"Stage 5 · Pilot","inp":[["b","Playbook"],["b","Pilot target list"],["b","Ops plan"]],"act":"Run first shipments with senior care on each. Log every issue. Ask for the repeat and a referral.","out":"Pilot shipments vs target, repeat shippers, issues log, actual margin.","dec":"Does the chosen door produce shipments?","g":"Day 60: first shipments moving. Day 90: shipments vs target, and at least 1 repeat shipper.","o":{"pass":"At or above target → Stage 6","hold":"{hold} to 100% → one more quarter","pivot":"Under {hold}% → back to Stage 3, next route","park":"Under {hold}% on the backup too → park"},"r":[["b","First shipment goes wrong","Any complaint on shipment 1","Senior person on it, fix within 24 hrs"],["b","Trial but no repeat","No second booking in 45 days","Call and ask why"],["b","Payment delays","Past agreed credit days","Credit limits before the pilot"],["i","Cargo held at customs","Query on the first bill of entry","Customs team on it the same day"]],"m":"Actual vs plan: revenue, margin per shipment, cost to win a client.","xl":"Pilot & Clients, Gates (pilot target), Money","ps":["hold"],"ns":{"st":"Not started","v":"","n":"• Not started. Research suggests a first group of 6–10 mid-size Noida / Greater Noida EMS and Tier-1 importers, approached through Sales at finance-head level. No pilot accounts named yet.","src":"Noida EMS research sheet, 'First GTM step'"}},"S6":{"t":"Stage 6 · Capture","inp":[["b","Pilot results"],["b","Client list"],["b","Service numbers"]],"act":"Grow from entry to share: freight → customs → warehousing, referrals, more partners, two-way bundles for traders who import and export.","out":"Share of active traders, services per client, referral share, market P&L.","dec":"Grow, hold, add a route, or pull back.","g":"Share rising each quarter, {ref}% or more of new clients from referrals by month 9, 2+ services per client.","o":{"pass":"Keep growing","hold":"Share flat → fix service first","pivot":"One route maxed → add the next","park":"Losing share 2 quarters → pull back to best clients"},"r":[["b","Price war","Clients ask us to match rates","Win on service, lock contracts"],["b","Too dependent on one","Over 40% volume from one client or partner","Spread through referrals and partners"],["b","Service slips","Complaints up, on-time down","Pause new clients until fixed"],["e","Buyer changes nomination","Buyer switches forwarder","Keep customs; work the buyer side"]],"m":"Market P&L every quarter. Capex is now on the table if demand is proven.","xl":"Pilot & Clients, Money","ps":["ref"],"ns":{"st":"Not started","v":"","n":"• Not started. Growth ideas from research: finished-goods export forwarding (round trip), reverse logistics, import handling for new-plant machinery (SPECS / ECMS), pooling across the cluster, then the same play in Sriperumbudur/Chennai, Tirupati and Hosur.","src":"Noida EMS research sheet, 'Cross-sell / expansion'"}},"LN":{"t":"Learn · Feed the next market","inp":[["b","Every gate result"],["b","Time and cost per stage"],["b","What worked, what failed"]],"act":"Short review. Update default gate numbers, idea cards and risks.","out":"Updated settings for the next market.","dec":"The next market starts with better numbers.","r":[["b","Skipping the review","No notes after a gate","30-minute review is part of the gate"]],"m":"Actual cost of entry vs plan.","xl":"Learnings, Settings, Idea cards, Risk library","ns":{"st":"In progress","v":"","n":"Lessons so far:\n• Contract manufacturers rarely control their freight. Ask 'who picks your forwarder?' in the first minute of every call.\n• The raw list's category column is too generic (140 of 168 say 'Electronics Manufacturing'). Tag product type and who owns the import decision before calling.\n• Cold-call pickup was about 20%. Doors (association, trade fair, WhatsApp) should come earlier in the next market.\n• A head-count gate (150 traders) doesn't fit an anchor market. A spend-based bar would judge markets like this better.\n• ELCINA's members are mostly in the south, so the directory is a test, not yet a channel, until it produces northern prospects.","src":"This project, Sept 2026"}}},"I":{"I1":{"n":"Trader mix","w":"Who the traders are, by type.","inp":[["e","Nominated (buyer abroad picks forwarder, sells FOB), self-controlled (CIF), owner-run, export desk"],["i","Supplier-nominated (buys CIF), self-controlled (buys FOB or EXW), trader or distributor, manufacturer importing inputs, e-com"],["b","Anchors and two-way traders (import inputs, export goods)"]],"src":"Incoterm and buyer or supplier name in trade data; one call question: who picks your forwarder?","st":"Guessed in Stage 0, confirmed in Stage 2","use":"Decides the route and the entry product.","who":["CEO","TEC","SAL"],"nc":"Partly known","nk":"• Import side. The belt has three business types: OEM (own brand), ODM (designs and builds for brands) and EMS / contract manufacturer (builds to someone else's design).\n• Contract manufacturers usually don't pick their forwarder: the brand arranges freight and delivers parts to them (from calls).\n• JSD Electronics buys FOB, so it controls its own freight (meeting, 15 Sept).\n• Of the 168 listed names, 140 are tagged only 'Electronics Manufacturing'; 28 are PCB/SMT job-work shops, which are likely contract manufacturers.","ngap":"What share of the universe owns its import decision; the Incoterm mix from bills-of-entry data; product-type tags for the 168 names."},"I2":{"n":"Lanes, volume","w":"Where cargo goes and how much.","inp":[["e","India → destination ports"],["i","Origin ports (China, Vietnam…) → Indian port or ICD"],["b","FCL, LCL or air; shipments a month; peak months"]],"src":"Shipping bills, bills of entry, ICD staff, calls","st":"Stage 0, checked in Stage 2","use":"Can our rates win, and when to push.","who":["OPS","SUP","TEC"],"nc":"Hypothesis","nk":"• Origins (research): China, plus Hong Kong, Vietnam, Korea and Taiwan. India's HS-85 imports from China are about US$47.7 bn.\n• Air through IGI for high-value, light parts (ICs, displays, camera modules); sea through JNPT/Mundra, then rail to ICD Dadri or Tughlakabad, for bulk (PCBs, mechanical parts, chargers, lithium batteries as Class 9 dangerous goods).\n• Mode split (research estimate, not Noida-specific): 65–80% sea/rail by weight; 45–60% air by value.\n• Peaks: June–October, and before Chinese New Year.\n• One real data point: JSD — 3–4 air shipments a month, 25–30 kg each, about a week door to door from Shenzhen.","ngap":"Noida import value and mode split by HS code (DGCI&S data pull); ICD Dadri electronics volumes; shipments a month for ₹500 cr+ targets."},"I3":{"n":"Doors, paths","w":"Every way in, and the path per account.","inp":[["b","Person, type, warmth, owner on our side, backup"],["b","Path: direct, via one door, via two doors"]],"src":"Our people, clients, associations, CHAs, banks, CAs","st":"Stage 1","use":"Which accounts we reach first, and how.","who":["CEO","SAL","OPS","CUS"],"nc":"Partly known","nk":"• ELCINA: Directory now (₹5,000), approved by Dibyanshu; membership later, only if the directory produces relevant prospects.\n• SEMICON India 2026: 12 contacts (logistics, supply and purchase people at Hitachi, Tata Electronics, NM Tronics, CIR-Q-TECH, NXP, SanDisk and others).\n• Cold calling from the sorted list, with WhatsApp follow-ups drafted for missed calls.\n• Field sales supports calling.","ngap":"A backup door for each target; doors through Hexalog's customs team, ICD and ops staff, and existing clients; a path for each Tier 1 account."},"I4":{"n":"Pains, setup","w":"What they use today and what hurts.","inp":[["b","Current CHA and forwarder, how long, happiness 1 to 5"],["e","Rates, delays, documents, credit"],["i","Duty, BIS and other checks, customs holds, demurrage"]],"src":"Calls and visits","st":"Stage 2","use":"Becomes the pitch.","who":["SAL","CUS"],"nc":"Hypothesis","nk":"• One setup confirmed: JSD uses ShipGlobal, buys FOB and pays duty itself (DDU). Anti-dumping duty came up, but the details weren't captured.\n• Research ideas, not yet heard from customers: duty paid upfront ties up cash; IC clearance delays; risk of the line stopping; forwarder, CHA and warehouse all separate with no single view.","ngap":"The top 3 pains with a rupee value from at least 3 companies; the current CHA/forwarder and a 1–5 happiness score for each target."},"I5":{"n":"Channel power","w":"How much the CHAs and associations control.","inp":[["b","Share cleared by top 5 CHAs, CHAs willing to partner"],["b","Association asks granted (list, endorsement, event slot)"]],"src":"CHA talks, association meeting","st":"Stage 1, confirmed in Stage 2","use":"High means a channel-led route.","who":["CUS","GRO"],"nc":"Partly known","nk":"• ELCINA: about 350 members, about 65% MSME and about 65% in the south; only 70–80 in the north, plus 14–15 in Manesar–Rajasthan. Membership fees are fixed; there is some room on stall and advertising rates.\n• ELCINA lists 'Logistics / Supply Chain' as a membership category.\n• How much CHAs control the cluster: not yet known.","ngap":"Share cleared by the top CHAs at IGI and ICD Dadri; CHAs willing to partner."},"I6":{"n":"Big players","w":"Anchors worth leadership time, and incumbents.","inp":[["b","Top 10 traders by volume, their yearly logistics spend"],["b","Incumbent forwarders seen on docks and trucks"]],"src":"Trade data, field walk","st":"Stage 0, checked in Stage 2","use":"Anchor means anchor-led; heavy incumbents mean win on service.","who":["CEO","SAL","OPS"],"nc":"Partly known","nk":"• Anchors (research): Samsung (its Noida plant is its largest mobile plant worldwide), Dixon and its unit Padget, Vivo, Oppo, Optiemus, Bhagwati. Around 50–100 anchor accounts in this ecosystem.\n• Uttar Pradesh makes about 45% of India's smartphones and 55% of its mobile components (Invest India).\n• Incumbents: global forwarders hold the OEM air accounts; CONCOR runs rail; local CHAs; 3PLs (DHL Supply Chain, Mahindra Logistics, TVS SCS) for warehousing; ShipGlobal at JSD.","ngap":"The top 10 importers by volume and their yearly logistics spend; which incumbent each target uses."},"I7":{"n":"Money","w":"Is the market worth it, and is building worth it?","inp":[["b","Shipments a year, revenue and margin per shipment"],["b","Cost per route, partner commission, memberships"],["b","Capex if we build (office, licence, warehouse)"]],"src":"Supply rates, Stage 2 calls, route costs","st":"Rough in Stage 0; route P&L at Gate 3; unit margin at Gate 4; actuals at Gate 5; market P&L at Gate 6","use":"Go or park, and build vs partner.","who":["CEO","SUP"],"nc":"Hypothesis","nk":"• India HS-85 imports: ₹7,50,324 cr (FY24-25, ELCINA / DGCI&S).\n• Import logistics spend for consumer electronics, IT hardware and appliances: about US$1.4 bn (Hexalog market map).\n• Noida/NCR: SAM about US$0.6–1.2 bn a year; 3-year SOM about US$25–70 m a year from 15–40 mid-size importers. Derived estimates, low confidence.\n• Known access costs: ELCINA Directory ₹5,000 (approved). Membership ₹1,18,000 / ₹2,06,500 / ₹4,13,000 for 1 / 2 / 5 years incl. GST (on hold).","ngap":"Revenue and margin per shipment; cost per route; payback. None can be built until Supply rates and real volumes are in."},"I8":{"n":"Capability","w":"What we have vs what this market needs.","inp":[["b","Ops at the ICD or port, local people"],["b","Customs licence or presence at the port"],["b","Warehouse, lane rates, tech"]],"src":"Ops, Customs, Supply, Tech","st":"Stage 0, decided in Stage 3","use":"Build, partner or buy.","who":["OPS","CUS","SUP","TEC"],"nc":"Unknown","nk":"To confirm with Operations, Customs, Supply and Tech:\n• Do we have an IGI air desk, and presence at ICD Dadri or Tughlakabad?\n• Our customs licence and AEO status at these gateways?\n• A warehouse near Noida, and a MOOWR (bonded) licence or partner?\n• How our China-lane rates compare?\n• Class 9 dangerous-goods handling for lithium batteries?\n• Public company claims, not verified internally: customs clearance at 10+ Indian ports; 150,000+ sq ft of storage across 6+ value-add centres. Whether any are near Noida is not known.","ngap":"All of the above."},"I9":{"n":"Rules, schemes","w":"What the government adds or blocks.","inp":[["i","Duty, BIS, WPC, EPR, anti-dumping on top HS codes"],["e","RoDTEP, drawback, trade deals like CEPA"],["b","Upcoming changes"]],"src":"Customs team, DGFT and CBIC notices, EPCs","st":"Stage 0, watched all through","use":"Pitch hooks and risk flags.","who":["CUS"],"nc":"Partly known","nk":"• Schemes to use: MOOWR (bonded manufacturing, duty deferred), AEO, FTWZ, PLI for mobiles and components and IT hardware 2.0, SPECS / ECMS, EPCG, PMP duty structuring.\n• Enforcement: BIS quality control orders are tightening at the port (86 QCOs in force).\n• Watch triggers: changes to basic customs duty or PMP; ECMS localisation replacing some imports; Jewar cargo terminal opening; NICDC township; anchor OEMs taking logistics in-house.","ngap":"Which targets already hold a MOOWR licence or AEO status; anti-dumping exposure on key HS codes."}},"GM":{"N":[["n1",411,189,122,"Owner","Owner"],["n2",411,331,122,"Export head","Purchase head"],["n3",269,331,122,"Buyer abroad","Supplier abroad"],["n4",269,189,122,"Their CHA","Their CHA"],["a",420,121,120,"Association","Association"],["b",500,260,120,"Bank, forex","Bank, LC"],["c",420,399,120,"CA, GST","BIS consultant"],["d",260,399,120,"Buying house","Distributor"],["e",180,260,120,"","Warehouse"],["f",260,121,120,"Trade fair","Trade fair"],["g",252,47,120,"Field sales","Field sales"],["h",128,172,120,"ICD, ops staff","ICD, ops staff"],["i",128,348,120,"Customs team","Customs team"],["j",252,473,120,"Our clients","Our clients"],["k",428,47,120,"Trade data","BoE data"],["l",552,172,120,"Apollo","Apollo"],["m",552,348,120,"Fair lists","Fair lists"],["n",428,473,120,"Marketplace","Origin agents"]],"INSIDE":["g","h","i"],"ST":{"1":{"n1":"l","n2":"c","n3":"c","n4":"l","a":"w","b":"c","c":"l","d":"c","e":"u","f":"l","g":"w","h":"w","i":"w","j":"l","k":"w","l":"w","m":"l","n":"u"},"2":{"n1":"w","n2":"l","n3":"c","n4":"w","a":"w","b":"x","c":"l","d":"l","e":"c","f":"w","g":"w","h":"w","i":"w","j":"l","k":"w","l":"w","m":"w","n":"c"}},"R":{"direct":["Direct",["n1","n2","g","k","l"]],"cha":["CHA-led",["n4","i","h"]],"assoc":["Association-led",["a","f","m"]],"anchor":["Anchor-led",["n1","g"]],"nom":["Buyer or supplier-side",["n3","n"]],"plat":["Platform or tech",["n","l"]],"two":["Two-way bundle",["n1","n2","j"]]},"TX":{"1":["Draw the map for this market. Every person we know goes on a ring, marked warm, lukewarm or cold. For each target account we pick a path: direct if we already know the decision maker, via one door, or via two doors. Nothing is fixed. Each market draws its own paths.","People tab: name, type, ring, warmth, Hexalog owner, backup. Accounts tab: path type and door used.","Most paths run through one person, or a ring is empty.","At least 3 ways in, of 2 or more types, each with a backup."],"2":["After the calls, the map moves. Warmth goes up or down. New names from conversations are added (their CHA, their buyer or supplier). Doors that went nowhere are marked dropped.","Update warmth and last-contact date; add new names; mark dropped doors with the reason.","A dropped door had no backup, or the decision makers (inner ring) are still cold.","Warmth is updated for every door we used."],"3":["The route decides which part of the map carries the market. Pick a route below: only the doors that route needs stay lit.","Set \"On chosen route\" = Yes in the People tab; note any door the route needs that is not warm yet.","The route needs a door that is still cold or not mapped.","Every door the route needs is warm, or has a warm path to it."],"4":["Doors on the route become signed partners with written terms, each with a Hexalog owner.","Partners tab: terms, commission, what they earn per shipment, owner, signed date.","A partner has made no deal 4 weeks after signing.","Terms signed with every route partner."],"5":["Pilot clients join the map as new doors. Partners are marked producing or silent. Doors that never worked are dropped.","Log referrals per partner per month; add pilot clients; drop silent doors.","A partner has been silent for a month, or all pilot clients came through one door.","At least 1 repeat shipper, and at least one partner producing."],"6":["Clients become referral sources and the outer ring grows. We check that no single door carries too much.","Referral share by source; share of new business per door.","One door brings more than 40% of new business.","Referral share is growing and no door is above 40%."]}},"EML":{"e":[{"n":"Owner","r":1,"s":"o","w":"u","v":true},{"n":"Export head","r":1,"s":"o","w":"u","v":true},{"n":"Their CHA","r":1,"s":"o","w":"u","v":true},{"n":"Buyer abroad","r":1,"s":"o","w":"u","v":true},{"n":"Association","r":2,"s":"o","w":"u","v":true},{"n":"Bank, forex","r":2,"s":"o","w":"u","v":true},{"n":"CA, GST","r":2,"s":"o","w":"u","v":true},{"n":"Buying house","r":2,"s":"o","w":"u","v":true},{"n":"Trade fair","r":2,"s":"o","w":"u","v":true},{"n":"Field sales","r":3,"s":"h","w":"w","v":true},{"n":"ICD, ops staff","r":3,"s":"h","w":"w","v":true},{"n":"Customs team","r":3,"s":"h","w":"w","v":true},{"n":"Our clients","r":3,"s":"o","w":"u","v":true},{"n":"Trade data","r":3,"s":"o","w":"u","v":true},{"n":"Apollo","r":3,"s":"o","w":"u","v":true},{"n":"Fair lists","r":3,"s":"o","w":"u","v":true},{"n":"Marketplace","r":3,"s":"o","w":"u","v":true}],"i":[{"n":"Owner / MD","r":1,"s":"o","w":"c","v":true},{"n":"Purchase / supply chain head","r":1,"s":"o","w":"l","v":true},{"n":"Brand behind the CM","r":1,"s":"o","w":"u","v":true},{"n":"Their CHA / forwarder","r":1,"s":"o","w":"u","v":true},{"n":"Supplier abroad","r":1,"s":"o","w":"u","v":true},{"n":"ELCINA","r":2,"s":"o","w":"w","v":true},{"n":"SEMICON India contacts","r":2,"s":"o","w":"l","v":true},{"n":"Bank, LC","r":2,"s":"o","w":"u","v":true},{"n":"BIS consultant","r":2,"s":"o","w":"u","v":true},{"n":"Distributor","r":2,"s":"o","w":"u","v":true},{"n":"Field sales","r":3,"s":"h","w":"w","v":true},{"n":"ICD, ops staff","r":3,"s":"h","w":"u","v":true},{"n":"Customs team","r":3,"s":"h","w":"u","v":true},{"n":"Our clients","r":3,"s":"o","w":"u","v":true},{"n":"BoE data","r":3,"s":"o","w":"u","v":true},{"n":"Company list (168)","r":3,"s":"o","w":"w","v":true},{"n":"Origin agents","r":3,"s":"o","w":"u","v":true}]},"ORG":{"SG":["Picture","People map","Listen","Route","Build","Pilot","Capture"],"D":[{"n":"CEO's office","d":"Owns the framework, every gate and the tracker. Noida: Vedant Sharma runs the study (desk research, company list, calling support, ELCINA and SEMICON, reports), reporting to Kanishka Verma, project lead. Dibyanshu (CEO) signs off at Gate 3.","c":[["L","Desk research, list cleaning, rough size"],["L","Draws the rings, owns the people register"],["H","Weekly calling session, scorecard"],["L","Route rules, money sheet, sign-off"],["H","Puts the playbook together"],["H","Tracks pilot vs target"],["H","Market P&L, learnings for the next market"]]},{"n":"Sales","d":"Owns every client relationship and leads calls and meetings. Noida: Abhishek Tikkha, Sales Head, with field sales on calling. Attended the ELCINA meeting (28 Sept).","c":[["",""],["H","Their contacts and past clients"],["L","Calls, visits, meetings"],["H","Reality check on the route"],["L","Tests the pitch on traders"],["L","Closes pilot clients"],["H","Cross-sell, account growth"]]},{"n":"Partnerships & Affiliates","d":"Associations, affiliates and partner terms. Noida: Wonsorin Kasomwoshi, Partnerships & Affiliates Manager, ran the ELCINA track — meeting 28 Sept, staged recommendation 29 Sept (Directory now, membership later), approved by Dibyanshu.","c":[["",""],["L","ELCINA directory and membership; association doors"],["H","Prospects from the ELCINA directory"],["H","Terms for an association-led route"],["",""],["",""],["H","Partner and affiliate growth"]]},{"n":"Growth","d":"Early on: lists, finding contacts, association and trade fair access.","c":[["H","Lead lists, Apollo, fair lists"],["H","Association memberships, event contacts"],["H","Contact finding, WhatsApp and email"],["",""],["H","Collateral, case studies"],["",""],["L","Referral engine, repeat campaigns"]]},{"n":"Supply","d":"Early on: tells us whether our rates can win on this market's lanes before we call anyone. Noida: the rate check on China → IGI and ICD Dadri lanes has not been done yet.","c":[["H","Can our rates win on the top lanes?"],["",""],["",""],["H","Route cost: rates and capacity"],["L","Rate card on the top lane"],["H","Space and capacity for the pilot"],["H","Better rates as volume grows"]]},{"n":"Operations","d":"Early on: ICD staff give us shipment data and are doors themselves. Noida: presence at IGI and ICD Dadri / Tughlakabad to confirm.","c":[["H","ICD staff share shipment data"],["H","ICD and port staff as doors"],["",""],["H","Can we serve this ICD or port?"],["H","Ops ready at the ICD"],["L","Runs pilot shipments"],["H","Service quality at scale"]]},{"n":"Customs team","d":"Early on: CHA intel and duty and compliance rules. The strongest door on imports. Noida: licence and AEO status at IGI and ICD Dadri, and a MOOWR route, to confirm.","c":[["H","Duty, BIS rules; export schemes"],["H","CHA contacts and intel"],["H","Sense-checks customs pains"],["H","Customs-first route, licence need"],["H","Customs offer, document pre-check"],["L","Clears pilot shipments"],["H","Compliance updates as client hooks"]]},{"n":"Tech","d":"Early on: trade data pulls and the sales tool.","c":[["H","Trade data pulls, clean-up"],["",""],["H","Sales tool, call logging"],["",""],["H","Tracking demo, partner deal view"],["H","Visibility for pilot clients"],["H","Client and partner portal"]]},{"n":"Customer experience","d":"Joins at Build: makes the first shipment a reference, then drives repeat and referral.","c":[["",""],["",""],["",""],["",""],["H","Onboarding plan"],["L","First-shipment care, fixes in 24 hrs"],["L","Feedback, repeat and referral asks"]]}]},"text":{"title":"Hexalog GTM Framework · Noida EMS","dek":"One puzzle, many pictures. The frame (stages and gates) is the same for every micro-market; the inside pieces change per market. We collect the inside pieces first, then capture the market.","s1h":"1 · The puzzle board","s1p":"Click any piece. Each stage card opens with where Noida EMS stands, then the method: inputs → what we do → output → decision, the gate, risks, who helps, the money check and the Excel tab. Each inside piece opens with what we know so far for Noida and what is still missing.","s2h":"2 · People map, gate by gate","s2p":"The map is drawn at Gate 1 and moves at every gate after. At Gate 3, pick a route to see which doors it needs.","s3h":"3 · Edit the people map","s3p":"Add, change, hide or delete people. Export and Import keep separate lists; Noida is an import market, so the Import list is filled. \"Copy for Excel\" gives rows for the People tab. Press Save changes at the top to keep your edits.","s4h":"4 · Hexalog org map","s4p":"Where each department comes in, with the Noida team named. Click a department to see its role at each stage.","mshort":"Noida EMS","mcard":"Micro-market R2-09 · Noida–Greater Noida–Yamuna Expressway electronics belt · Direction: Import (components for EMS, ODM and OEM plants)\nOwner: Vedant Sharma (CEO's office) · Project lead and reporting manager: Kanishka Verma · Sales Head: Abhishek Tikkha · Partnerships: Wonsorin Kasomwoshi · Sign-off: Dibyanshu (CEO)\nStarted 3 Sept 2026 · Last updated 1 Oct 2026","mnow":"Where we are: Stage 2 · Listen (Phase 1 · Survey in our four-phase charter).\n50 companies called, 10 conversations, 1 client meeting (JSD Electronics, 15 Sept). Pickup is about 20%, under the 25% floor, so the path is changing: ELCINA directory (approved), SEMICON contacts and WhatsApp follow-ups.\nNext gate: Gate 2 needs 40 real conversations and the top 3 pains. We are at 10 conversations and no confirmed pains."},"tiles":{"ST":["Start","Pick market"],"S0":["Picture","Stage 0"],"G0":["Gate 0","≥{minT} traders"],"S1":["People map","Stage 1"],"G1":["Gate 1","≥{doors} ways in"],"S2":["Listen","Stage 2"],"G2":["Gate 2","≥{talks} real talks"],"S3":["Route","Stage 3"],"G3":["Gate 3","Payback ≤{pay} mo"],"S4":["Build","Stage 4"],"G4":["Gate 4","Tested on {test}"],"S5":["Pilot","Stage 5"],"G5":["Gate 5","Repeat shipper"],"S6":["Capture","Stage 6"],"G6":["Gate 6","Share growing"],"LN":["Learn","Next market"],"I1":["","Partly known"],"I2":["","Research only"],"I3":["","Partly known"],"I4":["","Not yet heard"],"I5":["","Partly known"],"I6":["","Research only"],"I7":["","Estimates only"],"I8":["","To confirm"],"I9":["","Partly known"]},"defDir":"i"}</script><script id="fw-app">(function(){

/* ---------- generic form helpers ---------- */

  return h+'<button class="btn sm" data-add="'+path+'" data-n="'+cols.length+'">+ Add row</button></div>'}
function fit(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px'}
function bindForm(box,after){
  box.querySelectorAll('textarea[data-path]').forEach(function(el){fit(el);el.addEventListener('input',function(){fit(el)})});
  box.querySelectorAll('[data-path]').forEach(function(el){
    var h=function(){setP(el.getAttribute('data-path'),el.value);markDirty();if(after)after(el.getAttribute('data-path'))};
    el.addEventListener('input',h);if(el.tagName==='SELECT')el.addEventListener('change',h)});

}

 var h='<h3>'+esc(d.n)+'</h3><div>'+esc(d.d)+'</div>';d.c.forEach(function(c,j){if(c[0])h+='<div class="dp"><span>'+esc(O.SG[j])+(c[0]==='L'?' · <span style="color:var(--text-accent)">leads</span>':'')+'</span><span>'+esc(c[1])+'</span></div>'});p.innerHTML=h}
return {grid:grid,panel:panel};})();

/* ---------- save / download ---------- */
var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#fafaf7}img{max-width:100%}[hidden]{display:none!important}';
function headReset(){var st=document.head?document.head.querySelectorAll('style'):[];for(var i=0;i<st.length;i++){var t=st[i].textContent||'';if(/safe-area-inset|\[hidden\]/.test(t)&&!st[i].id)return t}return RESET}
function buildDoc(){var C='</scr'+'ipt>';
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+headReset()+'</style></head><body>'+
 '<title>Hexalog GTM Framework</title><style id="fw-style">'+$('fw-style').textContent+'</style>'+
 '<script type="text/html" id="fw-shell">'+SHELL+C+'<div id="fw-root"></div>'+
 '<script type="application/json" id="fw-data">'+JSON.stringify(DATA).replace(/</g,'\\u003c')+C+
 '<script id="fw-app">'+$('fw-app').textContent+C+'</body></html>'}
function save(){if(!art)return;var b=$('edSave');b.disabled=true;msg('Saving…');
 try{sessionStorage.setItem('fw-unsaved',JSON.stringify(DATA))}catch(e){}
 art.publish(buildDoc()).then(function(){DIRTY=false;msg('Saved. Reloading with your changes…')}).catch(function(e){var c=e&&e.code;b.disabled=false;
  if(c==='conflict')msg('Someone saved a newer version first. The page is reloading to it; you can restore your edits after it loads.');
  else if(['not_writer','not_granted','not_declared','consent_required','capability_disabled','capability_removed'].indexOf(c)>=0){readOnly();msg('This view is read-only. Ask the owner for edit access to save changes.')}
  else if(c==='rate_limited')msg('Saving too often. Wait a minute, then save again.');
  else if(c==='too_large')msg('The page is too large to save.');
  else msg('Could not save just now. Try again in a moment.')})}
function download(){if(!dl)return;dl.save({filename:'Hexalog_GTM_Framework.html',data:buildDoc()}).then(function(){msg('Downloaded.')}).catch(function(e){if(!e||e.code!=='cancelled')msg('Download did not go through.')})}
$('edToggle').onclick=function(){setEdit(!EDIT)};$('edSave').onclick=save;$('edDl').onclick=download;

/* ---------- restore unsaved edits ---------- */
(function(){var s=null;try{s=sessionStorage.getItem('fw-unsaved')}catch(e){}
 if(!s)return;if(s===JSON.stringify(DATA)){try{sessionStorage.removeItem('fw-unsaved')}catch(e){}return}
 $('restore').hidden=false;
 $('rsYes').onclick=function(){try{var d=JSON.parse(s);Object.keys(d).forEach(function(k){if(DATA[k]&&typeof DATA[k]==='object'&&!Array.isArray(DATA[k])&&d[k]&&typeof d[k]==='object')Object.keys(d[k]).forEach(function(kk){DATA[k][kk]=d[k][kk]});else DATA[k]=d[k]})}catch(e){}$('restore').hidden=true;DIRTY=true;renderAll();setEdit(true)};
 $('rsNo').onclick=function(){try{sessionStorage.removeItem('fw-unsaved')}catch(e){}$('restore').hidden=true}})();

renderAll();

 window.claude.use('artifact').then(function(a){art=a;bar()}).catch(function(){});
 window.claude.use('downloads').then(function(d){dl=d;bar()}).catch(function(){});
}
})();
